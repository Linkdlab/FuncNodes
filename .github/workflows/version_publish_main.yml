# this is an autogenerated file, do not edit it directly or your changes might be lost.
name: version_publish

on:
  push:
    branches:
      - main
      - master

env:
  IMAGE_NAME: linkdlab/funcnodes

jobs:
  version_publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
      id-token: write
      packages: write
    environment:
      name: main
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Install Package
        uses: ./.github/actions/install_package
        with:
          python_version: 3.12

      - name: Run Tests
        run: uv run pytest

      - name: Get current package version
        shell: bash
        id: get_version
        run: |
          CURRENT_VERSION=$(uvx poetry version --short)
          echo "CURRENT_VERSION=${CURRENT_VERSION}" >> $GITHUB_ENV
          echo "CURRENT_VERSION=${CURRENT_VERSION}"

      - name: Get latest version from PyPI
        shell: bash
        id: get_pypi_version
        run: |
          PACKAGE_NAME=$(uvx poetry version | awk '{print $1}')
          PYPI_LATEST_VERSION=$(curl -s https://pypi.org/pypi/$PACKAGE_NAME/json | jq -r .info.version)
          echo "PACKAGE_NAME=${PACKAGE_NAME}" >> $GITHUB_ENV
          echo "PYPI_LATEST_VERSION=${PYPI_LATEST_VERSION}" >> $GITHUB_ENV
          echo "PACKAGE_NAME=${PACKAGE_NAME}"
          echo "PYPI_LATEST_VERSION=${PYPI_LATEST_VERSION}"

      - name: Compare PyPI versions
        shell: bash
        id: compare_pypi_versions
        run: |
          if [ "$CURRENT_VERSION" != "$PYPI_LATEST_VERSION" ]; then
            echo "should_publish_pypi=true" >> $GITHUB_OUTPUT
          else
            echo "should_publish_pypi=false" >> $GITHUB_OUTPUT
          fi

      - name: Package project
        if: steps.compare_pypi_versions.outputs.should_publish_pypi == 'true'
        run: uv build

      - name: Publish package distributions to PyPI
        if: steps.compare_pypi_versions.outputs.should_publish_pypi == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          verbose: true

      - name: Check current version on PyPI
        shell: bash
        id: check_current_pypi_version
        run: |
          CURRENT_VERSION_ON_PYPI=false
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --output /dev/null "https://pypi.org/pypi/$PACKAGE_NAME/$CURRENT_VERSION/json"; then
              CURRENT_VERSION_ON_PYPI=true
              break
            fi
            sleep 10
          done
          echo "current_version_on_pypi=${CURRENT_VERSION_ON_PYPI}" >> $GITHUB_OUTPUT
          echo "current_version_on_pypi=${CURRENT_VERSION_ON_PYPI}"

      - name: Login to GHCR
        if: steps.check_current_pypi_version.outputs.current_version_on_pypi == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Docker image version in GHCR
        shell: bash
        id: check_docker_version
        if: steps.check_current_pypi_version.outputs.current_version_on_pypi == 'true'
        run: |
          IMAGE="ghcr.io/${IMAGE_NAME}:v${CURRENT_VERSION}"
          if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
            echo "docker_image_exists=true" >> $GITHUB_OUTPUT
            echo "should_publish_docker=false" >> $GITHUB_OUTPUT
          else
            echo "docker_image_exists=false" >> $GITHUB_OUTPUT
            echo "should_publish_docker=true" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        if: steps.check_docker_version.outputs.should_publish_docker == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        if: steps.check_docker_version.outputs.should_publish_docker == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./DOCKERFILE
          push: true
          build-args: |
            FUNCNODES_VERSION=${{ env.CURRENT_VERSION }}
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:v${{ env.CURRENT_VERSION }}
            ghcr.io/${{ env.IMAGE_NAME }}:latest

      - name: Check if tag exists
        shell: bash
        id: check_tag
        if: steps.check_current_pypi_version.outputs.current_version_on_pypi == 'true'
        run: |
          TAG_EXISTS=$(git tag -l "v$CURRENT_VERSION")
          if [ "$TAG_EXISTS" ]; then
            echo "tag_exists=true" >> $GITHUB_OUTPUT
          else
            echo "tag_exists=false" >> $GITHUB_OUTPUT
            fi

      - name: Create new tag
        shell: bash
        if: steps.check_tag.outputs.tag_exists == 'false'
        run: |
          git config --local user.name "${GITHUB_ACTOR}"
          git config --local user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          git tag -a v$CURRENT_VERSION -m "Release version $CURRENT_VERSION"
          git push origin v$CURRENT_VERSION
